services:
  server:
    image: server-pdr
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      HOST_SERVIDOR: ${SERVER_BIND_HOST:-0.0.0.0}
      PUERTO_SERVIDOR: ${SERVER_PORT:-5000}
      DIR_ARCHIVOS: ${SERVER_RECEIVE_DIRECTORY:-/app/ImagenesRecibidas}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-programacion_redes}
      DB_USER: ${MYSQL_USER:-pdr}
      DB_PASSWORD: ${MYSQL_PASSWORD:-pdr123}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    volumes:
      - "./ImagenesRecibidas:${SERVER_RECEIVE_DIRECTORY:-/app/ImagenesRecibidas}"
    stdin_open: true
    tty: true
    depends_on:
      mysql:
        condition: service_healthy

  client:
    image: cliente-pdr
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      HOST_SERVIDOR: ${SERVER_HOSTNAME:-server}
      PUERTO_SERVIDOR: ${SERVER_PORT:-5000}
      HOST_CLIENTE: ${CLIENT_BIND_HOST:-0.0.0.0}
      PUERTO_CLIENTE: ${CLIENT_PORT:-0}
    volumes:
      - "./Imagenes:${CLIENT_IMAGE_DIRECTORY:-/app/Imagenes}:ro"
    stdin_open: true
    tty: true
    depends_on:
      - server
  
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-programacion_redes}
      MYSQL_USER: ${MYSQL_USER:-pdr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pdr123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data: